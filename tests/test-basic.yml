name: Test basic usage - non-PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request context. Under workflow_dispatch
      # (which act always uses), context.payload.pull_request is undefined,
      # so the action calls setFailed('This action can only be run on pull requests').
      # We assert it fails gracefully with that expected message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          glob: "**/*.md"

      - name: Assert action failed gracefully (not in PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when not in a pull_request context"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
