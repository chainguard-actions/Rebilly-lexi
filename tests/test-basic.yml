name: Test basic action inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          glob: "**/*.md"

      - name: Assert action fails gracefully outside PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action requires a pull_request context to function.
          # Under workflow_dispatch (used by act), github.context has no
          # pull_request payload, so the action must fail with the appropriate error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not run on a pull request, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly reports failure when not run on a pull request"
