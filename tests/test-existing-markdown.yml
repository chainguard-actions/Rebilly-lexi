name: Test readability report using existing markdown files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/3/merge
      GITHUB_HEAD_REF: update-docs
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify test markdown files exist
        run: |
          echo "Checking for existing markdown files..."
          if [ ! -f "test-data/new/test-document.md" ]; then
            echo "FAIL: test-data/new/test-document.md not found"
            exit 1
          fi
          echo "PASS: test markdown files found"
          ls -la test-data/new/

      - name: Run Lexi on existing test-data markdown files
        id: lexi-existing
        continue-on-error: true
        uses: .
        with:
          github-token: fake-token-for-testing
          glob: 'test-data/**/*.md'

      - name: Assert action ran against existing markdown files
        run: |
          echo "Lexi action on test-data/**/*.md completed"
          echo "Action may fail to post PR comment without real token/PR - this is expected under act"
          echo "PASS: action was invoked with existing markdown files"
