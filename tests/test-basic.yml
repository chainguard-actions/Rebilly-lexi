name: Test basic usage - readability report on markdown files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a sample markdown file for testing
        run: |
          mkdir -p docs
          cat > docs/sample.md << 'EOF'
          # Sample Document

          This is a simple test document. It has short sentences. The words are easy to read.
          Good documentation uses plain language. Simple words help readers understand.
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add docs/sample.md
          git commit -m "Add sample markdown file"
      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          glob: "**/*.md"
        continue-on-error: true
      - name: Assert action ran (completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail when posting a PR comment with a fake token,
          # but it should not be skipped or produce an unexpected outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
