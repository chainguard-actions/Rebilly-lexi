name: Test with existing markdown files in repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify markdown files exist
        run: |
          echo "Checking for markdown files matching test-data/**/*.md"
          find test-data -name "*.md" | head -20
          COUNT=$(find test-data -name "*.md" | wc -l)
          echo "Found $COUNT markdown files"
          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: no markdown files found in test-data"
            exit 1
          fi
          echo "PASS: found $COUNT markdown files"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          glob: 'test-data/**/*.md'
        continue-on-error: true

      - name: Assert action ran without unexpected crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because we are not in a real GitHub PR context,
          # but it should not be skipped or produce an unknown outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
